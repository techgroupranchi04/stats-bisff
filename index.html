<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bengaluru International Short Film Festival | BISFF 2025</title>
    <meta name="description"
        content="The festival showcases shorts from across the world, creating a physical space for a great audience experience and bringing together a keen audience for the filmmakers. BISFF also exhibits works by past masters who have dabbled in short filmmaking that today is viewed as an art form that needs a unique approach.">

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon"
        href="https://api.freecomers.com/api/v1/non-auth-user/retrieve-media/images/film-festivals/film_festival_logo_F00313.webp">

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- jsPDF & autoTable Plugin -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #090909;
            --card: rgba(255, 255, 255, 0.055);
            --border: rgba(255, 255, 255, 0.09);
            --text: #ffffff;
            --muted: #999999;
            --muted-dark: #666666;

            --registration: #ffffff;
            --checkin: #e90000;
        }

        body {
            min-height: 100vh;
            font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: radial-gradient(circle at top left, #321616 0%, #151515 35%, #090909 100%);
            color: var(--text);
            padding: 40px 20px;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* =========================================================
            HEADER
        ========================================================= */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 20px;
            margin-bottom: 30px;
        }

        .title-section h1 {
            font-size: 32px;
            font-weight: 700;
            letter-spacing: -0.7px;
        }

        .title-section p {
            margin-top: 8px;
            color: var(--muted);
            font-size: 15px;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: flex-end;
        }

        /* =========================================================
            DATE SELECTOR & CONTROLS
        ========================================================= */
        .date-control {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 10px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid var(--border);
        }

        .date-control label {
            color: var(--muted);
            font-size: 12px;
        }

        .date-control input {
            border: none;
            outline: none;
            color: #ffffff;
            background: transparent;
            font-family: inherit;
            font-size: 13px;
            cursor: pointer;
            color-scheme: dark;
        }

        .date-control input::-webkit-calendar-picker-indicator {
            filter: invert(1);
            cursor: pointer;
        }

        .mode-switch {
            display: flex;
            padding: 3px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid var(--border);
        }

        .mode-button {
            border: none;
            outline: none;
            padding: 7px 11px;
            border-radius: 7px;
            background: transparent;
            color: #777777;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .mode-button.active {
            background: rgba(255, 255, 255, 0.12);
            color: #ffffff;
        }

        .live-status {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 9px 13px;
            border-radius: 30px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            color: #aaaaaa;
            font-size: 12px;
        }

        .live-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #4caf50;
            box-shadow: 0 0 10px rgba(76, 175, 80, 0.8);
            animation: pulse 1.8s infinite;
        }

        .live-dot.error {
            background: #e90000;
            box-shadow: 0 0 10px rgba(233, 0, 0, 0.8);
        }

        @keyframes pulse {
            0% {
                opacity: 1;
                transform: scale(1);
            }

            50% {
                opacity: 0.45;
                transform: scale(0.8);
            }

            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        .report-button {
            border: none;
            outline: none;
            padding: 9px 16px;
            border-radius: 10px;
            background: var(--checkin);
            color: #ffffff;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .report-button:hover {
            background: #c20000;
        }

        /* =========================================================
            REPORT MODAL
        ========================================================= */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(5px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: #151515;
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 30px;
            width: 90%;
            max-width: 450px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }

        .modal-header {
            margin-bottom: 25px;
        }

        .modal-header h2 {
            font-size: 20px;
            font-weight: 600;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--muted);
            font-size: 13px;
        }

        .form-group input[type="date"] {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            color: white;
            color-scheme: dark;
            font-family: inherit;
        }

        .checkbox-group {
            display: flex;
            gap: 20px;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            font-size: 14px;
        }

        .checkbox-label input {
            accent-color: var(--checkin);
            width: 16px;
            height: 16px;
            cursor: pointer;
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 30px;
        }

        .btn-cancel {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text);
            padding: 10px 20px;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-cancel:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        /* =========================================================
            CHART CARDS
        ========================================================= */

        .chart-card {
            padding: 28px;
            margin-bottom: 20px;
            border-radius: 20px;
            background: var(--card);
            border: 1px solid var(--border);
            backdrop-filter: blur(15px);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
        }

        .chart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 25px;
            padding: 10px 20px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .chart-header>div:first-child {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex: 1;
            gap: 30px;
        }

        .chart-title {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .chart-info {
            color: #777777;
            font-size: 12px;
        }

        .chart-wrapper {
            position: relative;
            width: 100%;
            height: 360px;
        }

        .error-message {
            display: none;
            padding: 14px 16px;
            margin-bottom: 20px;
            border-radius: 10px;
            background: rgba(233, 0, 0, 0.10);
            border: 1px solid rgba(233, 0, 0, 0.20);
            color: #ff6b6b;
            font-size: 14px;
        }

        .footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            color: var(--muted-dark);
            font-size: 13px;
        }

        .footer-left {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .refresh-button {
            visibility: hidden;
            border: none;
            outline: none;
            padding: 10px 17px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.07);
            color: #cccccc;
            font-size: 13px;
            cursor: pointer;
            transition: background 0.2s ease, opacity 0.2s ease;
        }

        .refresh-button:hover {
            background: rgba(255, 255, 255, 0.12);
        }

        .refresh-button:disabled {
            cursor: not-allowed;
            opacity: 0.5;
        }

        @media (max-width: 850px) {
            body {
                padding: 25px 15px;
            }

            .header {
                flex-direction: column;
                align-items: flex-start;
            }

            .header-right {
                width: 100%;
                justify-content: flex-start;
            }


            .chart-header {
                align-items: flex-start;
            }
        }

        @media (max-width: 600px) {
            .title-section h1 {
                font-size: 26px;
            }

            .header-right {
                flex-direction: column;
                align-items: stretch;
            }

            .date-control {
                justify-content: space-between;
            }

            .mode-switch {
                width: 100%;
            }

            .mode-button {
                flex: 1;
            }

            .live-status {
                width: fit-content;
            }


            .stat-value {
                font-size: 48px;
            }

            .chart-card {
                padding: 20px;
            }

            .chart-wrapper {
                height: 300px;
            }

            .footer {
                align-items: flex-start;
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <!-- HEADER -->
        <header class="header">
            <div class="title-section">
                <h1>Bengaluru International Short Film Festival</h1>
                <p id="selectedDateText">Loading...</p>
            </div>

            <div class="header-right">
                <!-- Generate Reports Button -->
                <button id="openReportBtn" class="report-button" type="button">
                    Generate Reports
                </button>

                <div class="live-status">
                    <span id="liveDot" class="live-dot"></span>
                    <span id="statusText">Live</span>
                </div>
            </div>
        </header>

        <!-- REGISTRATION TREND -->
        <section class="chart-card">
            <div class="chart-header">
                <div class="chart-title">Registration Trend</div>
                <div style="display: flex; align-items: center; gap: 8px;">
                    <span class="stat-value-text" id="registered"
                        style="color: #ffffff; font-size: 30px; font-weight: 700;">—</span>
                </div>
            </div>
            <div style="display: flex; gap: 15px; align-items: center; margin-bottom: 20px;">
                <div class="date-control">
                    <label for="regDatePicker">Date</label>
                    <input id="regDatePicker" type="date">
                </div>
                <div id="registrationChartInfo" class="chart-info">—</div>
            </div>
            <div id="registrationErrorMessage" class="error-message"></div>
            <div class="chart-wrapper">
                <canvas id="registrationChart"></canvas>
            </div>
        </section>

        <!-- CHECK-IN TREND -->
        <section class="chart-card">
            <div class="chart-header">
                <div>
                    <div>
                        <div class="chart-title">Check-in Trend</div>
                    </div>
                    <div style="display: flex; align-items: center; gap: 8px;">
                        <span class="stat-value-text" id="checkedIn"
                            style="color: #e90000; font-size: 30px; font-weight: 700;">—</span>
                    </div>
                </div>
            </div>
            <div style="display: flex; gap: 15px; align-items: center; margin-bottom: 20px;">
                <div class="date-control">
                    <label for="chkinDatePicker">Date</label>
                    <input id="chkinDatePicker" type="date">
                </div>
                <div id="checkinChartInfo" class="chart-info">—</div>
            </div>
            <div id="checkinErrorMessage" class="error-message"></div>
            <div class="chart-wrapper">
                <canvas id="checkinChart"></canvas>
            </div>
        </section>

        <!-- FOOTER -->
        <footer class="footer">
            <div class="footer-left">
                <div id="refreshInfo">Auto-refresh: Every 1 hour</div>
            </div>
            <button id="refreshButton" class="refresh-button" type="button">Refresh Now</button>
        </footer>
    </div>

    <!-- REPORT MODAL DIALOG -->
    <div id="reportModal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Generate Report</h2>
            </div>

            <div class="form-group">
                <label for="reportFromDate">From Date</label>
                <input type="date" id="reportFromDate">
            </div>

            <div class="form-group">
                <label for="reportToDate">To Date</label>
                <input type="date" id="reportToDate">
            </div>

            <div class="form-group">
                <label>Data Type</label>
                <div class="checkbox-group">
                    <label class="checkbox-label">
                        <input type="checkbox" id="chkRegistration" checked> Registration
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" id="chkCheckedIn" checked> Checked In
                    </label>
                </div>
            </div>

            <div class="modal-actions">
                <button id="closeReportBtn" class="btn-cancel">Cancel</button>
                <button id="downloadPdfBtn" class="report-button">Download PDF</button>
            </div>
        </div>
    </div>

    <script>
        const festivalId = 1142;
        const REGISTRATION_API = `https://api.stats.freecomers.com/festivals/${festivalId}/registered-statistics`;
        const CHECKIN_API = `https://api.stats.freecomers.com/festivals/${festivalId}/checkin-statistics`;
        const REFRESH_INTERVAL = 60 * 60 * 1000; // 1 hour in milliseconds

        let registrationChart = null;
        let checkinChart = null;

        const registeredElement = document.getElementById("registered");
        const checkedInElement = document.getElementById("checkedIn");
        const selectedDateTextElement = document.getElementById("selectedDateText");
        const registrationChartInfo = document.getElementById("registrationChartInfo");
        const checkinChartInfo = document.getElementById("checkinChartInfo");
        const registrationErrorElement = document.getElementById("registrationErrorMessage");
        const checkinErrorElement = document.getElementById("checkinErrorMessage");
        const statusElement = document.getElementById("statusText");
        const liveDotElement = document.getElementById("liveDot");
        const refreshButton = document.getElementById("refreshButton");
        const regDatePicker = document.getElementById("regDatePicker");
        const chkinDatePicker = document.getElementById("chkinDatePicker");
        const refreshInfo = document.getElementById("refreshInfo");

        const reportModal = document.getElementById("reportModal");
        const openReportBtn = document.getElementById("openReportBtn");
        const closeReportBtn = document.getElementById("closeReportBtn");
        const downloadPdfBtn = document.getElementById("downloadPdfBtn");
        const reportFromDate = document.getElementById("reportFromDate");
        const reportToDate = document.getElementById("reportToDate");
        const chkRegistration = document.getElementById("chkRegistration");
        const chkCheckedIn = document.getElementById("chkCheckedIn");

        function getTodayString() {
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, "0");
            const day = String(now.getDate()).padStart(2, "0");
            return `${year}-${month}-${day}`;
        }

        function formatSelectedDate(dateString) {
            if (!dateString) return "";
            const date = new Date(`${dateString}T00:00:00`);
            return date.toLocaleDateString("en-IN", {
                day: "numeric", month: "long", year: "numeric"
            });
        }

        function formatTableDate(dateString) {
            if (!dateString) return "";
            const date = new Date(`${dateString}T00:00:00`);
            const d = String(date.getDate()).padStart(2, '0');
            const m = date.toLocaleString('en-US', { month: 'short' });
            const y = String(date.getFullYear()).slice(-2);
            return `${d}-${m}-${y}`;
        }

        function formatTimestamp(timestamp) {
            if (!timestamp) return "—";
            const date = new Date(Number(timestamp) * 1000);
            return date.toLocaleString("en-IN", {
                day: "numeric", month: "short", year: "numeric",
                hour: "numeric", minute: "2-digit", second: "2-digit", hour12: true
            });
        }

        function formatNumber(value) {
            return Number(value || 0).toLocaleString("en-IN");
        }

        // Generate Dates List between range
        function getDateRangeArray(startDate, endDate) {
            const dates = [];
            let current = new Date(`${startDate}T00:00:00`);
            const end = new Date(`${endDate}T00:00:00`);
            while (current <= end) {
                const y = current.getFullYear();
                const m = String(current.getMonth() + 1).padStart(2, "0");
                const d = String(current.getDate()).padStart(2, "0");
                dates.push(`${y}-${m}-${d}`);
                current.setDate(current.getDate() + 1);
            }
            return dates;
        }

        /* ============================================================
            REPORT GENERATION & PDF DOWNLOAD
        ============================================================ */
        openReportBtn.addEventListener("click", () => {
            reportModal.style.display = "flex";
            if (!reportToDate.value) reportToDate.value = getTodayString();
            if (!reportFromDate.value) reportFromDate.value = getTodayString();
        });

        closeReportBtn.addEventListener("click", () => {
            reportModal.style.display = "none";
        });

        window.addEventListener("click", (e) => {
            if (e.target === reportModal) reportModal.style.display = "none";
        });

        downloadPdfBtn.addEventListener("click", async () => {
            const from = reportFromDate.value;
            const to = reportToDate.value;
            const hasReg = chkRegistration.checked;
            const hasCheck = chkCheckedIn.checked;

            if (!from || !to) {
                alert("Please select both 'From' and 'To' dates.");
                return;
            }
            if (from > to) {
                alert("'From Date' cannot be greater than 'To Date'.");
                return;
            }
            if (!hasReg && !hasCheck) {
                alert("Please select at least one data type (Registration or Checked In).");
                return;
            }

            const dates = getDateRangeArray(from, to);
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();

            // Pre-fetch all data to calculate summary totals
            const reportData = { reg: [], chk: [] };
            let grandTotalReg = 0;
            let grandTotalChk = 0;

            for (const d of dates) {
                if (hasReg) {
                    let history = [];
                    try {
                        const res = await fetchStats(REGISTRATION_API, d);
                        history = res?.data?.history || [];
                    } catch (err) {
                        console.error(`Error fetching reg for ${d}:`, err);
                    }
                    reportData.reg.push({ date: d, history });
                    history.forEach(h => { grandTotalReg += Number(h.count || 0); });
                }

                if (hasCheck) {
                    let history = [];
                    try {
                        const res = await fetchStats(CHECKIN_API, d);
                        history = res?.data?.history || [];
                    } catch (err) {
                        console.error(`Error fetching chk for ${d}:`, err);
                    }
                    reportData.chk.push({ date: d, history });
                    history.forEach(h => { grandTotalChk += Number(h.count || 0); });
                }
            }

            let currentY = 15;

            // 1. Report Header
            doc.setFontSize(16);
            doc.setFont("helvetica", "bold");
            doc.setTextColor(20, 20, 20);
            doc.text("Bengaluru International Short Film Festival", 105, currentY, { align: "center" });
            currentY += 7;

            doc.setFontSize(11);
            doc.setFont("helvetica", "normal");
            doc.setTextColor(80, 80, 80);
            doc.text(`Report Period: ${formatSelectedDate(from)} to ${formatSelectedDate(to)}`, 105, currentY, { align: "center" });
            currentY += 8;

            // Header Separator Line
            doc.setLineWidth(0.5);
            doc.setDrawColor(210, 210, 210);
            doc.line(20, currentY, 190, currentY);
            currentY += 8;

            // 2. Summary Section
            doc.setFontSize(12);
            doc.setFont("helvetica", "bold");
            doc.setTextColor(20, 20, 20);
            doc.text("Total Summary (Selected Range):", 20, currentY);
            currentY += 6;

            doc.setFontSize(11);
            doc.setFont("helvetica", "normal");
            doc.setTextColor(50, 50, 50);
            if (hasReg) {
                doc.text(`Registered Users: ${formatNumber(grandTotalReg)}`, 25, currentY);
                currentY += 6;
            }
            if (hasCheck) {
                doc.text(`Checked In Users: ${formatNumber(grandTotalChk)}`, 25, currentY);
                currentY += 6;
            }

            // Add padding before tables
            currentY += 4;

            // 3. Generate Tables
            function buildTable(title, dataArray) {
                const tableRows = [];

                dataArray.forEach(dayData => {
                    dayData.history.forEach((entry, idx) => {
                        const dateCell = (idx === 0) ? formatTableDate(dayData.date) : "";
                        tableRows.push([
                            dateCell,
                            entry.at || "-",
                            formatNumber(entry.count || 0)
                        ]);
                    });
                });

                doc.autoTable({
                    startY: currentY,
                    head: [
                        [{ content: title, colSpan: 3, styles: { halign: 'center', fontStyle: 'bold', fontSize: 13, fillColor: [245, 245, 245], textColor: [0, 0, 0] } }],
                        ['Date', 'Time', 'Total Users']
                    ],
                    body: tableRows,
                    theme: 'grid',
                    headStyles: {
                        fillColor: [255, 255, 255],
                        textColor: [0, 0, 0],
                        fontStyle: 'bold',
                        lineWidth: 0.2,
                        lineColor: [210, 210, 210]
                    },
                    bodyStyles: {
                        textColor: [30, 30, 30],
                        fontSize: 10,
                        lineWidth: 0.2,
                        lineColor: [225, 225, 225]
                    },
                    columnStyles: {
                        0: { cellWidth: 50, halign: 'center' },
                        1: { cellWidth: 50, halign: 'center' },
                        2: { cellWidth: 'auto', halign: 'right' }
                    },
                    margin: { left: 20, right: 20 }
                });

                currentY = doc.lastAutoTable.finalY + 15;
            }

            if (hasReg) {
                buildTable("Registered Users", reportData.reg);
            }

            if (hasCheck) {
                // Prevent check-in table from splitting weirdly if space is low
                if (hasReg && currentY > 210) {
                    doc.addPage();
                    currentY = 20;
                }
                buildTable("Checked In Users", reportData.chk);
            }

            doc.save(`BISFF_Report_${from}_to_${to}.pdf`);
            reportModal.style.display = "none";
        });



        /* ============================================================
            API & DASHBOARD LOGIC
        ============================================================ */
        async function fetchStats(endpoint, selectedDate) {
            const url = new URL(endpoint);
            url.searchParams.set("date", selectedDate);
            const finalUrl = url.toString();
            console.log("API URL:", finalUrl);

            const response = await fetch(finalUrl, {
                method: "GET",
                headers: { "Accept": "application/json" },
                cache: "no-store"
            });

            if (!response.ok) {
                throw new Error(`API request failed: ${response.status}`);
            }
            return response.json();
        }

        async function loadRegistrationStats() {
            const selectedDate = regDatePicker.value;
            if (!selectedDate) return;

            try {
                statusElement.textContent = "Updating...";
                liveDotElement.classList.remove("error");
                registrationErrorElement.style.display = "none";

                const registrationResponse = await fetchStats(REGISTRATION_API, selectedDate);
                const registrationData = registrationResponse?.data;

                if (!registrationData) {
                    throw new Error("Invalid registration API response.");
                }

                const registered = Number(registrationData.total || 0);
                registeredElement.textContent = formatNumber(registered);

                const registrationHistory = Array.isArray(registrationData.history) ? registrationData.history : [];
                updateRegistrationChart(registrationHistory);

                registrationChartInfo.textContent = `${registrationHistory.length} hourly points`;
                statusElement.textContent = "Live";

            } catch (error) {
                console.error("Failed to load registration statistics:", error);
                statusElement.textContent = "Error";
                liveDotElement.classList.add("error");
                registrationErrorElement.textContent = error.message || "Unable to load registration statistics.";
                registrationErrorElement.style.display = "block";
            }
        }

        async function loadCheckinStats() {
            const selectedDate = chkinDatePicker.value;
            if (!selectedDate) return;

            try {
                statusElement.textContent = "Updating...";
                liveDotElement.classList.remove("error");
                checkinErrorElement.style.display = "none";
                console.log("Fetching check-in completed url:", `${CHECKIN_API}${selectedDate}`);
                const checkinResponse = await fetchStats(CHECKIN_API, selectedDate);
                console.log("Check-in API response:", checkinResponse);
                const checkinData = checkinResponse?.data;

                if (!checkinData) {
                    throw new Error("Invalid check-in API response.");
                }

                const checkedIn = Number(checkinData.total || 0);
                checkedInElement.textContent = formatNumber(checkedIn);

                const checkinHistory = Array.isArray(checkinData.history) ? checkinData.history : [];
                updateCheckinChart(checkinHistory);

                checkinChartInfo.textContent = `${checkinHistory.length} hourly points`;
                statusElement.textContent = "Live";

            } catch (error) {
                console.error("Failed to load check-in statistics:", error);
                statusElement.textContent = "Error";
                liveDotElement.classList.add("error");
                checkinErrorElement.textContent = error.message || "Unable to load check-in statistics.";
                checkinErrorElement.style.display = "block";
            }
        }

        function updateRegistrationChart(history) {
            const labels = history.map(item => item.time);
            const values = history.map(item => Number(item.count || 0));

            if (registrationChart) registrationChart.destroy();

            const context = document.getElementById("registrationChart").getContext("2d");
            registrationChart = new Chart(context, {
                type: "line",
                data: {
                    labels,
                    datasets: [{
                        label: "Registered Users",
                        data: values,
                        borderColor: "#ffffff",
                        backgroundColor: "rgba(255, 255, 255, 0.08)",
                        borderWidth: 2,
                        pointRadius: 4,
                        tension: 0.35,
                        fill: true
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            backgroundColor: "rgba(0, 0, 0, 0.8)",
                            titleColor: "#ffffff",
                            bodyColor: "#ffffff",
                            borderColor: "#ffffff",
                            borderWidth: 1,
                            padding: 10,
                            displayColors: false,
                            callbacks: {
                                label: function (context) {
                                    return "👤: " + context.parsed.y;
                                }
                            }
                        }
                    },
                    scales: {
                        x: { grid: { color: "rgba(255, 255, 255, 0.05)" }, ticks: { color: "#777777" } },
                        y: { beginAtZero: true, grid: { color: "rgba(255, 255, 255, 0.05)" }, ticks: { color: "#777777" } }
                    }
                }
            });
        }

        function updateCheckinChart(history) {
            const labels = history.map(item => item.time);
            const values = history.map(item => Number(item.count || 0));

            if (checkinChart) checkinChart.destroy();

            const context = document.getElementById("checkinChart").getContext("2d");
            checkinChart = new Chart(context, {
                type: "line",
                data: {
                    labels,
                    datasets: [{
                        label: "Checked In Users",
                        data: values,
                        borderColor: "#e90000",
                        backgroundColor: "rgba(233, 0, 0, 0.08)",
                        borderWidth: 2,
                        pointRadius: 4,
                        tension: 0.35,
                        fill: true
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            backgroundColor: "rgba(0, 0, 0, 0.8)",
                            titleColor: "#e90000",
                            bodyColor: "#ffffff",
                            borderColor: "#e90000",
                            borderWidth: 1,
                            padding: 10,
                            displayColors: false,
                            callbacks: {
                                label: function (context) {
                                    return "👤: " + context.parsed.y;
                                }
                            }
                        }
                    },
                    scales: {
                        x: { grid: { color: "rgba(255, 255, 255, 0.05)" }, ticks: { color: "#777777" } },
                        y: { beginAtZero: true, grid: { color: "rgba(255, 255, 255, 0.05)" }, ticks: { color: "#777777" } }
                    }
                }
            });
        }


        regDatePicker.addEventListener("change", () => loadRegistrationStats());
        chkinDatePicker.addEventListener("change", () => loadCheckinStats());
        refreshButton.addEventListener("click", () => {
            loadRegistrationStats();
            loadCheckinStats();
        });

        regDatePicker.value = getTodayString();
        chkinDatePicker.value = getTodayString();
        selectedDateTextElement.textContent = formatSelectedDate(getTodayString());
        loadRegistrationStats();
        loadCheckinStats();

        setInterval(() => {
            if (regDatePicker.value === getTodayString()) loadRegistrationStats();
            if (chkinDatePicker.value === getTodayString()) loadCheckinStats();
        }, REFRESH_INTERVAL);

    </script>
</body>

</html>
