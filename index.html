<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bengaluru International Short Film Festival | BISFF 2025</title>
    <meta name="description"
        content="The festival showcases shorts from across the world, creating a physical space for a great audience experience and bringing together a keen audience for the filmmakers. BISFF also exhibits works by past masters who have dabbled in short filmmaking that today is viewed as an art form that needs a unique approach.">
    <link rel="stylesheet" href="styles.css">
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon"
        href="https://api.freecomers.com/api/v1/non-auth-user/retrieve-media/images/film-festivals/film_festival_logo_F00313.webp">

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>


</head>

<body>

    <div class="container">

        <!-- HEADER -->
        <header class="header">
            <div class="title-section">
                <h1>Bengaluru International Short Film Festival</h1>
                <p id="selectedDateText" style="visibility: hidden;">Loading...</p>
            </div>

            <div class="header-right">
                <!-- Generate Reports Button -->
                <a class="report-button" type="button" href="/reports/index.html">
                    View Reports
                </a>

                <div class="live-status">
                    <span id="liveDot" class="live-dot"></span>
                    <span id="statusText">Live</span>
                </div>
            </div>
        </header>

        <!-- REGISTRATION TREND -->
        <section class="chart-card">
            <div class="chart-header">
                <div class="chart-title">Registration Trend</div>
                <div style="display: flex; align-items: center; gap: 8px;">
                    <span class="stat-value-text" id="registered"
                        style="color: var(--fc-foreground); font-size: 30px; font-weight: 700;">—</span>
                </div>
            </div>
            <div style="display: flex; gap: 15px; align-items: center; margin-bottom: 20px;">
                <div class="date-control">
                    <label for="regDatePicker">Date</label>
                    <input id="regDatePicker" type="date">
                </div>
                <div id="registrationChartInfo" class="chart-info">—</div>
            </div>
            <div id="registrationErrorMessage" class="error-message"></div>
            <div class="chart-wrapper">
                <canvas id="registrationChart"></canvas>
            </div>
        </section>

        <!-- CHECK-IN TREND -->
        <section class="chart-card">
            <div class="chart-header">
                <div>
                    <div>
                        <div class="chart-title">Check-in Trend</div>
                    </div>
                    <div style="display: flex; align-items: center; gap: 8px;">
                        <span class="stat-value-text" id="checkedIn"
                            style="color: var(--fc-brand); font-size: 30px; font-weight: 700;">—</span>
                    </div>
                </div>
            </div>
            <div style="display: flex; gap: 15px; align-items: center; margin-bottom: 20px;">
                <div class="date-control">
                    <label for="chkinDatePicker">Date</label>
                    <input id="chkinDatePicker" type="date">
                </div>
                <div id="checkinChartInfo" class="chart-info">—</div>
            </div>
            <div id="checkinErrorMessage" class="error-message"></div>
            <div class="chart-wrapper">
                <canvas id="checkinChart"></canvas>
            </div>
        </section>

        <!-- FOOTER -->
        <footer class="footer">
            <div class="footer-left">
                <div id="refreshInfo">Auto-refresh: Every 1 hour</div>
            </div>
            <button id="refreshButton" class="refresh-button" type="button">Refresh Now</button>
        </footer>
    </div>

    <script>
        const festivalId = 1142;
        const REGISTRATION_API = `https://api.stats.freecomers.com/festivals/${festivalId}/registered-statistics`;
        const CHECKIN_API = `https://api.stats.freecomers.com/festivals/${festivalId}/checkin-statistics`;
        const REFRESH_INTERVAL = 60 * 60 * 1000; // 1 hour in milliseconds

        let registrationChart = null;
        let checkinChart = null;

        const registeredElement = document.getElementById("registered");
        const checkedInElement = document.getElementById("checkedIn");
        const selectedDateTextElement = document.getElementById("selectedDateText");
        const registrationChartInfo = document.getElementById("registrationChartInfo");
        const checkinChartInfo = document.getElementById("checkinChartInfo");
        const registrationErrorElement = document.getElementById("registrationErrorMessage");
        const checkinErrorElement = document.getElementById("checkinErrorMessage");
        const statusElement = document.getElementById("statusText");
        const liveDotElement = document.getElementById("liveDot");
        const refreshButton = document.getElementById("refreshButton");
        const regDatePicker = document.getElementById("regDatePicker");
        const chkinDatePicker = document.getElementById("chkinDatePicker");
        const refreshInfo = document.getElementById("refreshInfo");


        function getTodayString() {
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, "0");
            const day = String(now.getDate()).padStart(2, "0");
            return `${year}-${month}-${day}`;
        }

        function formatSelectedDate(dateString) {
            if (!dateString) return "";
            const date = new Date(`${dateString}T00:00:00`);
            return date.toLocaleDateString("en-IN", {
                day: "numeric", month: "long", year: "numeric"
            });
        }

        function formatTableDate(dateString) {
            if (!dateString) return "";
            const date = new Date(`${dateString}T00:00:00`);
            const d = String(date.getDate()).padStart(2, '0');
            const m = date.toLocaleString('en-US', { month: 'short' });
            const y = String(date.getFullYear()).slice(-2);
            return `${d}-${m}-${y}`;
        }

        function formatTimestamp(timestamp) {
            if (!timestamp) return "—";
            const date = new Date(Number(timestamp) * 1000);
            return date.toLocaleString("en-IN", {
                day: "numeric", month: "short", year: "numeric",
                hour: "numeric", minute: "2-digit", second: "2-digit", hour12: true
            });
        }

        function formatNumber(value) {
            return Number(value || 0).toLocaleString("en-IN");
        }

        // Generate Dates List between range
        function getDateRangeArray(startDate, endDate) {
            const dates = [];
            let current = new Date(`${startDate}T00:00:00`);
            const end = new Date(`${endDate}T00:00:00`);
            while (current <= end) {
                const y = current.getFullYear();
                const m = String(current.getMonth() + 1).padStart(2, "0");
                const d = String(current.getDate()).padStart(2, "0");
                dates.push(`${y}-${m}-${d}`);
                current.setDate(current.getDate() + 1);
            }
            return dates;
        }


        /* ============================================================
            API & DASHBOARD LOGIC
        ============================================================ */
        async function fetchStats(endpoint, selectedDate) {
            const url = new URL(endpoint);
            url.searchParams.set("date", selectedDate);
            const finalUrl = url.toString();
            console.log("API URL:", finalUrl);

            const response = await fetch(finalUrl, {
                method: "GET",
                headers: { "Accept": "application/json" },
                cache: "no-store"
            });

            if (!response.ok) {
                throw new Error(`API request failed: ${response.status}`);
            }
            return response.json();
        }

        async function loadRegistrationStats() {
            const selectedDate = regDatePicker.value;
            if (!selectedDate) return;

            try {
                statusElement.textContent = "Updating...";
                liveDotElement.classList.remove("error");
                registrationErrorElement.style.display = "none";

                const registrationResponse = await fetchStats(REGISTRATION_API, selectedDate);
                const registrationData = registrationResponse?.data;

                if (!registrationData) {
                    throw new Error("Invalid registration API response.");
                }

                const registered = Number(registrationData.total || 0);
                registeredElement.textContent = formatNumber(registered);

                const registrationHistory = Array.isArray(registrationData.history) ? registrationData.history : [];
                updateRegistrationChart(registrationHistory);

                registrationChartInfo.textContent = `${registrationHistory.length} hourly points`;
                statusElement.textContent = "Live";

            } catch (error) {
                console.error("Failed to load registration statistics:", error);
                statusElement.textContent = "Error";
                liveDotElement.classList.add("error");
                registrationErrorElement.textContent = error.message || "Unable to load registration statistics.";
                registrationErrorElement.style.display = "block";
            }
        }

        async function loadCheckinStats() {
            const selectedDate = chkinDatePicker.value;
            if (!selectedDate) return;

            try {
                statusElement.textContent = "Updating...";
                liveDotElement.classList.remove("error");
                checkinErrorElement.style.display = "none";
                console.log("Fetching check-in completed url:", `${CHECKIN_API}${selectedDate}`);
                const checkinResponse = await fetchStats(CHECKIN_API, selectedDate);
                console.log("Check-in API response:", checkinResponse);
                const checkinData = checkinResponse?.data;

                if (!checkinData) {
                    throw new Error("Invalid check-in API response.");
                }

                const checkedIn = Number(checkinData.total || 0);
                checkedInElement.textContent = formatNumber(checkedIn);

                const checkinHistory = Array.isArray(checkinData.history) ? checkinData.history : [];
                updateCheckinChart(checkinHistory);

                checkinChartInfo.textContent = `${checkinHistory.length} hourly points`;
                statusElement.textContent = "Live";

            } catch (error) {
                console.error("Failed to load check-in statistics:", error);
                statusElement.textContent = "Error";
                liveDotElement.classList.add("error");
                checkinErrorElement.textContent = error.message || "Unable to load check-in statistics.";
                checkinErrorElement.style.display = "block";
            }
        }

        function updateRegistrationChart(history) {
            const labels = history.map(item => item.time);
            const values = history.map(item => Number(item.count || 0));

            if (registrationChart) registrationChart.destroy();

            const context = document.getElementById("registrationChart").getContext("2d");
            registrationChart = new Chart(context, {
                type: "line",
                data: {
                    labels,
                    datasets: [{
                        label: "Registered Users",
                        data: values,
                        borderColor: "#f7f5f2",
                        backgroundColor: "rgba(247, 245, 242, 0.08)",
                        borderWidth: 2,
                        pointRadius: 4,
                        tension: 0.35,
                        fill: true
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            backgroundColor: "rgba(10, 9, 8, 0.9)",
                            titleColor: "#f7f5f2",
                            bodyColor: "#f7f5f2",
                            borderColor: "#3a3632",
                            borderWidth: 1,
                            padding: 10,
                            displayColors: false,
                            callbacks: {
                                label: function (context) {
                                    return "👤: " + context.parsed.y;
                                }
                            }
                        }
                    },
                    scales: {
                        x: { grid: { color: "rgba(58, 54, 50, 0.4)" }, ticks: { color: "#a8a39c" } },
                        y: { beginAtZero: true, grid: { color: "rgba(58, 54, 50, 0.4)" }, ticks: { color: "#a8a39c" } }
                    }
                }
            });
        }

        function updateCheckinChart(history) {
            const labels = history.map(item => item.time);
            const values = history.map(item => Number(item.count || 0));

            if (checkinChart) checkinChart.destroy();

            const context = document.getElementById("checkinChart").getContext("2d");
            checkinChart = new Chart(context, {
                type: "line",
                data: {
                    labels,
                    datasets: [{
                        label: "Checked In Users",
                        data: values,
                        borderColor: "#e86a6a",
                        backgroundColor: "rgba(232, 106, 106, 0.12)",
                        borderWidth: 2,
                        pointRadius: 4,
                        tension: 0.35,
                        fill: true
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            backgroundColor: "rgba(10, 9, 8, 0.9)",
                            titleColor: "#e86a6a",
                            bodyColor: "#f7f5f2",
                            borderColor: "#e86a6a",
                            borderWidth: 1,
                            padding: 10,
                            displayColors: false,
                            callbacks: {
                                label: function (context) {
                                    return "👤: " + context.parsed.y;
                                }
                            }
                        }
                    },
                    scales: {
                        x: { grid: { color: "rgba(58, 54, 50, 0.4)" }, ticks: { color: "#a8a39c" } },
                        y: { beginAtZero: true, grid: { color: "rgba(58, 54, 50, 0.4)" }, ticks: { color: "#a8a39c" } }
                    }
                }
            });
        }


        regDatePicker.addEventListener("change", () => loadRegistrationStats());
        chkinDatePicker.addEventListener("change", () => loadCheckinStats());
        refreshButton.addEventListener("click", () => {
            loadRegistrationStats();
            loadCheckinStats();
        });

        regDatePicker.value = getTodayString();
        chkinDatePicker.value = getTodayString();
        selectedDateTextElement.textContent = formatSelectedDate(getTodayString());
        loadRegistrationStats();
        loadCheckinStats();

        setInterval(() => {
            if (regDatePicker.value === getTodayString()) loadRegistrationStats();
            if (chkinDatePicker.value === getTodayString()) loadCheckinStats();
        }, REFRESH_INTERVAL);

    </script>
</body>

</html>
